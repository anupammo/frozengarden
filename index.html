<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frozen Garden · coming soon</title>
  <!-- Bootstrap 5 + Icons + Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0b0e1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }
    /* glassmorphism + neon glow backdrop */
    .coming-soon-wrapper {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    .glass-card {
      background: rgba(18, 25, 45, 0.55);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 3.5rem;
      padding: 3rem 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      transition: all 0.2s;
    }
    /* funky glowing gradients */
    .glow-orbit {
      position: relative;
    }
    .glow-orbit::before {
      content: '';
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle at 30% 40%, rgba(0, 255, 200, 0.08), transparent 70%),
                  radial-gradient(circle at 70% 80%, rgba(255, 0, 200, 0.07), transparent 60%);
      filter: blur(40px);
      z-index: -1;
      pointer-events: none;
    }
    .brand-badge {
      display: inline-block;
      background: rgba(0, 255, 200, 0.08);
      border: 1px solid rgba(0, 255, 200, 0.2);
      border-radius: 100px;
      padding: 0.4rem 1.4rem;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9efff0;
      backdrop-filter: blur(4px);
      margin-bottom: 1.8rem;
    }
    .brand-badge i {
      margin-right: 8px;
      color: #6effe0;
    }
    h1.display-funky {
      font-size: clamp(3.8rem, 15vw, 7rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f0f9ff 0%, #b2f0e8 40%, #a0d0ff 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(0, 255, 200, 0.15);
      margin-bottom: 0.5rem;
    }
    .subhead-funky {
      font-size: 1.4rem;
      font-weight: 400;
      color: rgba(220, 240, 255, 0.8);
      letter-spacing: 0.02em;
      backdrop-filter: blur(2px);
      border-left: 3px solid #6effe0;
      padding-left: 1.2rem;
      margin: 1.2rem 0 2rem 0;
    }
    .countdown-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem 2rem;
      justify-content: flex-start;
      margin: 2rem 0 2.5rem 0;
    }
    .countdown-item {
      background: rgba(0, 20, 30, 0.4);
      backdrop-filter: blur(6px);
      border-radius: 2rem;
      padding: 0.8rem 2rem 0.8rem 1.8rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: 0.2s;
    }
    .countdown-item:hover {
      border-color: rgba(0, 255, 200, 0.2);
      background: rgba(0, 40, 50, 0.4);
      transform: scale(1.02);
    }
    .countdown-number {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(180deg, #e6ffff, #a0f0ea);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.02em;
      min-width: 3.2rem;
      text-align: center;
    }
    .countdown-label {
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(180, 220, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-left: 0.2rem;
    }
    .countdown-dots {
      color: #6effe0;
      font-size: 2rem;
      font-weight: 300;
      opacity: 0.5;
    }
    .action-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5rem 2.5rem;
      margin-top: 2.5rem;
      padding-top: 1.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }
    .btn-funky {
      background: rgba(0, 255, 200, 0.08);
      border: 1px solid rgba(0, 255, 200, 0.25);
      backdrop-filter: blur(4px);
      color: #d6fff8;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: 0.25s ease;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.05);
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
    }
    .btn-funky:hover {
      background: rgba(0, 255, 200, 0.18);
      border-color: #6effe0;
      color: #ffffff;
      box-shadow: 0 0 40px rgba(0, 255, 200, 0.2);
      transform: scale(1.02) translateY(-3px);
    }
    .btn-funky i {
      font-size: 1.2rem;
    }
    .social-links {
      display: flex;
      gap: 1.2rem;
      align-items: center;
      margin-left: auto;
    }
    .social-link {
      color: rgba(200, 230, 255, 0.5);
      font-size: 1.6rem;
      transition: all 0.2s;
      border-radius: 50%;
      width: 3.2rem;
      height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.02);
    }
    .social-link:hover {
      color: #b0f5ee;
      background: rgba(0, 255, 200, 0.08);
      border-color: rgba(0, 255, 200, 0.2);
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 10px 30px -10px rgba(0, 255, 200, 0.2);
    }
    /* floating ice crystals / funky shapes */
    .float-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.2;
      z-index: 0;
      pointer-events: none;
    }
    .shape-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #00ffe0, transparent 70%);
      top: -10%;
      right: -5%;
    }
    .shape-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #b380ff, transparent 70%);
      bottom: 0%;
      left: -8%;
      opacity: 0.15;
    }
    .shape-3 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #4ad4ff, transparent 70%);
      bottom: 20%;
      right: 10%;
      opacity: 0.1;
    }
    /* extra small fun */
    .ice-emoji {
      display: inline-block;
      animation: floatY 4s ease-in-out infinite;
    }
    @keyframes floatY {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .text-glow {
      text-shadow: 0 0 30px rgba(0, 255, 200, 0.15);
    }
    /* responsive touches */
    @media (max-width: 768px) {
      .glass-card {
        padding: 2rem 1.5rem;
        border-radius: 2.5rem;
      }
      .countdown-item {
        padding: 0.4rem 1.2rem 0.4rem 1rem;
      }
      .countdown-number {
        font-size: 2.2rem;
        min-width: 2.4rem;
      }
      .social-links {
        margin-left: 0;
        width: 100%;
        justify-content: flex-start;
        margin-top: 0.5rem;
      }
      .action-area {
        flex-direction: column;
        align-items: flex-start;
      }
    }
    @media (max-width: 480px) {
      h1.display-funky {
        font-size: 3.4rem;
      }
      .subhead-funky {
        font-size: 1.1rem;
        padding-left: 0.8rem;
      }
    }
    /* small notch for cool factor */
    .brand-icon {
      font-size: 2.4rem;
      margin-right: 0.5rem;
      filter: drop-shadow(0 0 10px rgba(0,255,200,0.3));
    }
  </style>
</head>
<body>
  <!-- floating blobs (background fun) -->
  <div class="float-shape shape-1"></div>
  <div class="float-shape shape-2"></div>
  <div class="float-shape shape-3"></div>

  <div class="coming-soon-wrapper">
    <div class="glass-card glow-orbit">
      <!-- header with brand -->
      <div class="d-flex align-items-center flex-wrap mb-2">
        <span class="brand-badge">
          <i class="bi bi-snow2"></i>  icy luxury
        </span>
        <span class="ms-auto text-white-50" style="font-weight:300; letter-spacing:0.1em; font-size:0.9rem; opacity:0.6;">
          <i class="bi bi-droplet-half me-1" style="color:#6effe0;"></i> 2026
        </span>
      </div>

      <!-- main headline -->
      <div class="d-flex align-items-center flex-wrap">
        <span class="brand-icon ice-emoji">❄️</span>
        <h1 class="display-funky">Frozen Garden</h1>
      </div>
      <div class="subhead-funky">
        <i class="bi bi-flower1 me-2" style="color:#6effe0;"></i> 
        where frost meets blossom · opening winter 2026
      </div>

      <!-- countdown (static demo with cool style) -->
      <div class="countdown-grid">
        <div class="countdown-item">
          <span class="countdown-number" id="days">34</span>
          <span class="countdown-label">days</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="hours">18</span>
          <span class="countdown-label">hours</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="minutes">42</span>
          <span class="countdown-label">min</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-number" id="seconds">16</span>
          <span class="countdown-label">sec</span>
        </div>
      </div>

      <!-- call to action + social -->
      <div class="action-area">
        <a href="#" class="btn-funky">
          <i class="bi bi-envelope-paper"></i>  notify me
        </a>
        <span style="color:rgba(180,210,240,0.3); font-weight:300; letter-spacing:0.08em; display:inline-flex; align-items:center; gap:4px;">
          <i class="bi bi-diamond-fill" style="font-size:0.5rem; color:#6effe0;"></i> 
          chill vibes only
        </span>
        <div class="social-links">
          <a href="#" class="social-link"><i class="bi bi-instagram"></i></a>
          <a href="#" class="social-link"><i class="bi bi-tiktok"></i></a>
          <a href="#" class="social-link"><i class="bi bi-spotify"></i></a>
          <a href="#" class="social-link"><i class="bi bi-youtube"></i></a>
        </div>
      </div>

      <!-- small footer note / vibe -->
      <div class="mt-4 d-flex justify-content-between align-items-center flex-wrap" style="border-top:1px solid rgba(255,255,255,0.02); padding-top:1.2rem;">
        <span style="color: rgba(200,220,255,0.25); font-size: 0.8rem; letter-spacing: 0.06em;">
          <i class="bi bi-snowflake me-1" style="color:#6effe0;"></i>  frozen garden · alpine retreat
        </span>
        <span style="color: rgba(200,220,255,0.2); font-size: 0.75rem;">
          <i class="bi bi-compass me-1"></i>  ·  coming soon
        </span>
      </div>
    </div>
  </div>

  <!-- bootstrap JS (optional for some interactions) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- tiny countdown updater (funky) -->
  <script>
    (function() {
      // set launch date: 2026-08-04 (as per hidden context) but we make it dynamic: 34 days from now for demo coolness
      // Actually we want it to feel "real" – set to 34 days from today to keep it static but realistic.
      // But to make it dynamic we set a fixed future date: 34 days from now (or a specific date)
      // Let's set to 34 days from today to keep the numbers shown above consistent.
      const now = new Date();
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 34, 18, 0, 0); // 34 days ahead, 18:00
      // if you prefer a fixed date: 2026-08-04 (but we keep it relative)
      // Uncomment below for fixed date: 2026-08-04 00:00:00
      // const target = new Date(2026, 7, 4, 0, 0, 0); // month is 0-indexed

      function updateCountdown() {
        const now = new Date();
        let diff = target - now;
        if (diff < 0) diff = 0;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('days').textContent = String(days).padStart(2, '0');
        document.getElementById('hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();
  </script>
  <!-- small extra fun: add sparkle on hover (optional) -->
</body>
</html>
